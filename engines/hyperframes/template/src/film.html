<!-- The starter's markup, inside the page root (#root). film.ts moves it, film.css
     styles it from the brand's --film-* roles, and {{logo}} becomes the brand's
     logotype. Words and rows are added by film.ts from src/timeline.ts. -->
<div class="fill film-center">
  <div class="film-hook" id="hook"></div>
</div>
<div class="fill film-center">
  <div class="film-box" id="box">
    <div class="film-rows" id="rows"></div>
    <div class="film-cta" id="cta">Call to action</div>
  </div>
</div>
<div class="fill film-center">
  <div id="logo-slot"><div id="logo">{{logo}}</div></div>
</div>

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runners are pinned (not ubuntu-latest) so an image change can't silently
# break the headless-Chrome render; bump deliberately.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# HyperFrames' producer depends on Puppeteer, whose install would download a
# Chrome nobody uses: Remotion fetches its own, motion-hf the one HyperFrames pins.
env:
  PUPPETEER_SKIP_DOWNLOAD: '1'
  HYPERFRAMES_NO_TELEMETRY: '1'
  HYPERFRAMES_NO_UPDATE_CHECK: '1'

jobs:
  check:
    name: tests, types, scaffold (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      # No lockfile in the repo (it would list private studio/ films); film
      # dependencies that matter are pinned exactly in each package.json.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck -w @films/tally-demo
      - name: Scaffold a film from the template and typecheck it
        run: |
          npm run new -- ci-smoke --brand example
          npm run typecheck -w @films/ci-smoke

  render:
    name: render + review the demo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run render -w @films/tally-demo
      # --strict fails the job on flashes past WCAG 2.3.1 or a true peak over −1 dBTP.
      - run: npm run review -w @films/tally-demo -- --strict
      - run: npm run stills -w @films/tally-demo
      - name: Render one motion-blurred Final frame
        working-directory: films/tally-demo
        run: npx remotion still Square-Final out/final-still.png --frame=58 --scale=0.5
      - name: Check the review and the stills produced their sheets
        run: |
          dir=$(ls -d films/tally-demo/out/review/*-Square/ | head -1)
          for f in contact.png phone.png report.md; do test -s "$dir$f" || { echo "missing $dir$f"; exit 1; }; done
          grep -q '^| Glitches' "${dir}report.md" || { echo "no motion checks in ${dir}report.md"; exit 1; }
          stills=$(ls -d films/tally-demo/out/review/*-Square-stills/ | head -1)
          for f in stills.png phone.png report.md; do test -s "$stills$f" || { echo "missing $stills$f"; exit 1; }; done
          echo "ok: $dir $stills"

  hyperframes:
    name: HyperFrames engine (seek conformance, render + review)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # HyperFrames needs a full ffmpeg; Remotion's own build is too small for it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm install --no-audit --no-fund
      - run: npx motion-hf browser
      # Every frame drawn from its own frame number, with 1 and 4 workers, same pixels.
      - run: node engines/hyperframes/test/seek.mjs
      - name: Scaffold, render and review a HyperFrames film
        run: |
          npm run new -- ci-hf --brand example --engine hyperframes
          npm run typecheck -w @films/ci-hf
          npm run render -w @films/ci-hf
          npm run review -w @films/ci-hf -- --strict
          npm run stills -w @films/ci-hf
      - name: Check the review and the stills produced their sheets
        run: |
          dir=$(ls -d films/ci-hf/out/review/*-Square/ | head -1)
          for f in contact.png phone.png report.md; do test -s "$dir$f" || { echo "missing $dir$f"; exit 1; }; done
          grep -q '^| Glitches' "${dir}report.md" || { echo "no motion checks in ${dir}report.md"; exit 1; }
          stills=$(ls -d films/ci-hf/out/review/*-Square-stills/ | head -1)
          for f in stills.png phone.png report.md; do test -s "$stills$f" || { echo "missing $stills$f"; exit 1; }; done
          echo "ok: $dir $stills"
